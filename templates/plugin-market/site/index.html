<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>__PLATFORM__ Plugin Market</title>
    <meta name="description" content="Search __PLATFORM__ plugins and skills and copy the install command." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%237aa2f7'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="top">
      <div class="wrap">
        <h1 id="name">__PLATFORM__ Plugin Market</h1>
        <p class="sub">Search, copy, paste into your terminal. <a href="__REPO_URL__#add-a-plugin">Add yours</a>.</p>
        <div class="controls">
          <input id="q" type="search" placeholder="Search plugins and skills (press /)" autocomplete="off" />
          <select id="sort" aria-label="Sort">
            <option value="name">A to Z</option>
            <option value="newest">Newest</option>
          </select>
        </div>
        <nav id="chips"></nav>
        <p id="count" class="count"></p>
      </div>
    </header>
    <main class="wrap"><section id="grid" class="grid"></section></main>
    <footer class="wrap foot"><a href="__REPO_URL__">Source</a> · MIT · Not affiliated with the vendor of __PLATFORM__.</footer>
    <script type="module" src="app.mjs"></script>
  </body>
</html>
